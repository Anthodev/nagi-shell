[settings]
schema_version=2

[appearance]
scheme=nagi-dark
accent_mode=wallpaper
custom_surface=#080D16
custom_text=#EFF3F8
custom_accent=#5B6FF5
surface_opacity=0.96
border_intensity=0
blur_enabled=false
motion=full
font_family=Noto Sans
outer_radius=16

[island]
compact_height=46
compact_padding=24
expanded_width_percent=1
expanded_height_percent=1
show_workspace=true
show_weather=true
show_media=true
feedback_duration=normal
gaming_indicator=true

[clock]
format=24h
show_seconds=false
date_format=dddd, d MMMM
show_idle_date=false

[media]
enabled=true
compact_visible=true
dashboard_visible=true
player_policy=automatic
preferred_application=""

[notifications]
popups_enabled=true
do_not_disturb=false
critical_mode=bypass
dashboard_visible=true
history_visible=true

[weather]
enabled=false
consent=false
location_label=""
latitude=-
longitude=-
temperature_unit=auto
wind_unit=auto
refresh_preset=1h

[wallpaper]
roots=[]
