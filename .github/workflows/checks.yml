# Repository-defined checks for pull requests targeting develop and pushes to develop.
#
# Every job calls repository-owned Make targets; the Makefile remains the only
# definition of what the checks do. The jobs never weaken, skip, or special-case
# product tests for CI.
#
# Environment contract:
#   - Pinned Fedora 44 container aligned with the supported local toolchain.
#   - Quickshell installed from the stable errornointernet/quickshell COPR and
#     PipeWire, GIO, KF6 GlobalAccel, and Python D-Bus fixture dependencies
#     installed from Fedora; `make requirements` validates the complete toolchain.
#   - No secret, privileged runner, GPU, real KDE session, or external service
#     state is required.
#
# Scope boundary:
#   A successful run covers formatting, native normalization, D-Bus owner
#   lifecycle, the native audio bridge protocol and volume math, QML adapter
#   boundaries, coordinator determinism, and the real PanelWindow state and
#   UI-primitive scenarios inside disposable virtual KWin sessions. Success
#   here does NOT prove physical HDR/VRR, hardware integration, or frame pacing
#   at a monitor's real refresh rate.
name: Repository checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

# Superseded pull-request runs are cancelled; pushes to develop are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  LANG: C.UTF-8

jobs:
  nondisplay:
    name: Display-independent checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: fedora:44
    env:
      XDG_RUNTIME_DIR: /tmp/xdg
      # Windowless QML tests run on Qt's headless platform; the surface-state job
      # below intentionally does not set this and connects to a real compositor.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the Fedora 44 toolchain
        uses: ./.github/actions/install-toolchain

      - name: Prepare the runtime directory
        run: mkdir -p "$XDG_RUNTIME_DIR"

      - name: Verify repository requirements
        run: make requirements

      - name: Run display-independent checks
        run: make check-nondisplay

  surface-state:
    name: Surface checks (virtual KWin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:44
    env:
      XDG_RUNTIME_DIR: /tmp/xdg
      # Qt Quick uses deterministic CPU rasterization inside virtual KWin.
      QT_QUICK_BACKEND: software
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the Fedora 44 toolchain
        uses: ./.github/actions/install-toolchain
      - name: Install the virtual KWin compositor
        run: |
          dnf -y --setopt=install_weak_deps=False install kwin
          kwin_path="$(command -v kwin_wayland)"
          # Fedora's binary carries file capabilities rejected by container
          # runtimes. A fresh installed copy keeps the executable mode without
          # carrying those extended attributes.
          install -m 0755 "$kwin_path" /usr/local/bin/kwin_wayland
          printf '%s\n' /usr/local/bin >>"$GITHUB_PATH"
          export PATH="/usr/local/bin:$PATH"
          hash -r
          resolved_kwin_path="$(command -v kwin_wayland)"
          printf 'Using capability-free KWin at %s\n' "$resolved_kwin_path"
          test "$resolved_kwin_path" = /usr/local/bin/kwin_wayland

      - name: Prepare the runtime directory
        run: install -d -m 0700 "$XDG_RUNTIME_DIR"

      - name: Verify repository requirements
        run: make requirements

      - name: Run surface and UI-primitive checks in virtual KWin
        run: |
          logdir=/tmp/nagi-diagnostics
          rm -rf "$logdir"
          mkdir -p "$logdir"

          set +e
          make test-surface-state >"$logdir/quickshell.log" 2>&1 \
            && make test-ui-primitives >>"$logdir/quickshell.log" 2>&1 \
            && make test-typography >>"$logdir/quickshell.log" 2>&1
          test_status=$?
          set -e

          # Diagnostics stay bounded so a failing run cannot flood artifact storage.
          tail -n 400 "$logdir/quickshell.log" >"$logdir/quickshell-bounded.log" \
            2>/dev/null || true

          if [ "$test_status" -ne 0 ]; then
            printf 'Virtual KWin surface checks failed (status %s).\n' "$test_status" >&2
            exit "$test_status"
          fi

      - name: Upload bounded diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surface-state-diagnostics
          path: /tmp/nagi-diagnostics/*-bounded.log
          retention-days: 7
          if-no-files-found: ignore
