name: 'Install Fedora 44 toolchain'
description: >-
  Installs the pinned Fedora 44 CI toolchain: native Qt, KF6 GlobalAccel,
  PipeWire and GIO development dependencies, Python D-Bus fixtures, typography
  fonts, QML tools, and Quickshell from the stable COPR.
runs:
  using: composite
  steps:
    - name: 'Install base toolchain packages'
      shell: bash
      run: |
        set -euo pipefail
        retry() {
          local attempt status
          for attempt in 1 2 3 4; do
            if "$@"; then
              return 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 4 ]; then
              return "$status"
            fi
            printf 'Network command failed; retrying in %s seconds (%s/4).\n' \
              "$((attempt * 5))" "$attempt" >&2
            sleep "$((attempt * 5))"
          done
        }
        packages=(
          git
          make
          gcc-c++
          cmake
          pkgconf-pkg-config
          pipewire-devel
          glib2-devel
          kf6-kglobalaccel-devel
          qt6-qtbase-devel
          qt6-qtdeclarative-devel
          dbus-daemon
          python3-dbus-next
          rsms-inter-fonts
          google-noto-sans-fonts
          adobe-source-sans-pro-fonts
          dejavu-sans-fonts
          diffutils
        )
        retry dnf -y --setopt=install_weak_deps=False install "${packages[@]}"

    - name: 'Configure the stable Quickshell COPR'
      shell: bash
      run: |
        set -euo pipefail
        cat > /etc/yum.repos.d/errornointernet-quickshell.repo <<'EOF'
        [copr:errornointernet:quickshell]
        name=Quickshell stable COPR
        baseurl=https://download.copr.fedorainfracloud.org/results/errornointernet/quickshell/fedora-$releasever-$basearch/
        enabled=1
        gpgcheck=1
        repo_gpgcheck=0
        gpgkey=https://download.copr.fedorainfracloud.org/results/errornointernet/quickshell/pubkey.gpg
        skip_if_unavailable=False
        EOF

    - name: 'Install Quickshell from the stable channel'
      shell: bash
      run: |
        set -euo pipefail
        retry() {
          local attempt status
          for attempt in 1 2 3 4; do
            if "$@"; then
              return 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 4 ]; then
              return "$status"
            fi
            printf 'Network command failed; retrying in %s seconds (%s/4).\n' \
              "$((attempt * 5))" "$attempt" >&2
            sleep "$((attempt * 5))"
          done
        }
        retry dnf -y --setopt=install_weak_deps=False install quickshell
        rpm -q quickshell

    - name: 'Report installed tool versions'
      shell: bash
      run: |
        for tool in cmake qmlformat-qt6 qmllint-qt6 qtpaths6 dbus-run-session; do
          command -v "$tool"
        done
